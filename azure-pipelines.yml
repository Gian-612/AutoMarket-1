# Node.js
# Build a general Node.js project with npm.

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    npm install
  displayName: 'npm install'
  workingDirectory: 'Automarketbackend'

- script: |
    curl -X POST "https://api.render.com/deploy/srv-dal0m75g1s2s73dqq3v0?key=Cg2SyPwim9Q"
  displayName: 'Deploy a Render'
  workingDirectory: 'Automarketbackend'