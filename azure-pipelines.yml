# Node.js
# Build a general Node.js project with npm.

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    npm install
  displayName: 'npm install'

- script: |
    curl -X POST "https://api.render.com/deploy/srv-datvcsh7lnhs73es9u20?key=na105n1RYDo"
  displayName: 'Deploy a Render'